<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05070d" />
    <meta name="description" content="LY 的前端开发作品集：Vue 3、TypeScript、AI 应用与高性能前端实践。" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='32' fill='%23050810'/%3E%3Cpath d='M20 44V20h7v18h12v6H20Zm22 0V20h8v24h-8Z' fill='%237df7ff'/%3E%3C/svg%3E"
    />
    <title>LY · 前端开发</title>
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem('orbit-notes-theme');
          const savedLocale = localStorage.getItem('orbit-notes-locale');
          document.documentElement.dataset.theme =
            savedTheme === 'light' || savedTheme === 'dark' ? savedTheme : 'dark';
          document.documentElement.lang = savedLocale === 'en' ? 'en' : 'zh-CN';
        } catch {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
